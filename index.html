<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bay Cities - Print Label</title>
<script src="BrowserPrint-3.1.250.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; background: #181818; color: #fff; text-align: center; padding: 60px 20px; }
  h1 { color: #E05A2B; font-size: 20px; }
  .status { font-size: 16px; margin: 20px 0; }
  .ok { color: #4BBFBF; }
  .err { color: #E05A2B; }
  button { background: #E05A2B; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 16px; }
  button:hover { opacity: 0.9; }
</style>
</head>
<body>

<h1>Bay Cities - Label Print</h1>
<div id="status" class="status">Looking for printer...</div>
<button id="retryBtn" style="display:none;" onclick="printLabel()">Print again</button>

<script>
function getParam(name) {
  var params = new URLSearchParams(window.location.search);
  return params.get(name) || "";
}

// ^ and ~ are ZPL command characters, so they can't appear in printed text
function clean(text) {
  return String(text || "").replace(/[\^~\\]/g, " ").trim();
}

function shorten(text, maxChars) {
  return text.length > maxChars ? text.substring(0, maxChars - 1) + "…" : text;
}

// Product names come in as "Name 1|Name 2|Name 3". Falls back to the old desc field.
function getItemNames() {
  var raw = getParam("items");
  if (!raw) raw = getParam("desc");
  var seen = {};
  var names = [];
  raw.split("|").forEach(function (n) {
    var c = clean(n);
    if (c && !seen[c.toLowerCase()]) {
      seen[c.toLowerCase()] = true;
      names.push(c);
    }
  });
  return names;
}

// Fits the product names into the space between the project number and the location.
// Fewer names print bigger; very long lists end with "+ N more".
function buildItemsBlock(names) {
  var top = 290, bottom = 760, width = 760;
  var space = bottom - top;
  var sizes = [60, 48, 40, 34, 28];
  var size = sizes[sizes.length - 1];
  for (var i = 0; i < sizes.length; i++) {
    if (Math.floor(space / (sizes[i] + 10)) >= names.length) { size = sizes[i]; break; }
  }
  var maxLines = Math.floor(space / (size + 10));
  var maxChars = Math.floor(width / (size * 0.55));

  var lines = names.map(function (n) { return shorten("- " + n, maxChars); });
  if (lines.length > maxLines) {
    var extra = lines.length - (maxLines - 1);
    lines = lines.slice(0, maxLines - 1);
    lines.push("+ " + extra + " more");
  }
  if (lines.length === 0) lines = ["(no items listed)"];

  return "^FO20," + top + "^A0N," + size + "," + size +
         "^FB" + width + "," + maxLines + ",10,L,0^FD" + lines.join("\\&") + "^FS\n";
}

function buildZPL() {
  var boxId = clean(getParam("boxid"));
  var pm = shorten(clean(getParam("pm")) || "No PM", 16);
  var project = clean(getParam("project"));
  var loc = clean(getParam("loc")) || "Not assigned";
  var names = getItemNames();

  return "^XA\n" +
    "^CI28\n" +
    "^PW812\n" +
    "^LL1218\n" +
    // PM name, largest, at the top
    "^FO20,30^A0N,100,100^FB772,1,0,L,0^FD" + pm + "^FS\n" +
    // Project number
    "^FO20,145^A0N,55,55^FDProject " + (project || "none") + "^FS\n" +
    "^FO20,220^GB760,4,4^FS\n" +
    // Product names
    "^FO20,240^A0N,26,26^FDITEMS^FS\n" +
    buildItemsBlock(names) +
    "^FO20,775^GB760,3,3^FS\n" +
    // Location
    "^FO20,795^A0N,26,26^FDLOCATION^FS\n" +
    "^FO20,830^A0N,70,70^FD" + loc + "^FS\n" +
    // Box ID, small
    "^FO20,935^A0N,34,34^FDBox " + boxId + "^FS\n" +
    // Barcode at the bottom
    "^FO238,1000^BY3^BCN,170,N,N,N^FD" + boxId + "^FS\n" +
    "^XZ\n";
}

function setStatus(msg, cls) {
  var el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status " + (cls || "");
}

function printLabel() {
  document.getElementById("retryBtn").style.display = "none";
  setStatus("Looking for printer...");

  if (typeof BrowserPrint === "undefined") {
    setStatus("Browser Print not detected. Install it from zebra.com and reload this page.", "err");
    document.getElementById("retryBtn").style.display = "inline-block";
    return;
  }

  BrowserPrint.getDefaultDevice("printer", function (device) {
    if (!device) {
      setStatus("No default printer configured in Browser Print.", "err");
      document.getElementById("retryBtn").style.display = "inline-block";
      return;
    }

    var zpl = buildZPL();
    device.send(zpl, function () {
      setStatus("Label sent to " + device.name + ". You can close this tab.", "ok");
    }, function (error) {
      setStatus("Print failed: " + error, "err");
      document.getElementById("retryBtn").style.display = "inline-block";
    });
  }, function (error) {
    setStatus("Could not connect to Browser Print: " + error, "err");
    document.getElementById("retryBtn").style.display = "inline-block";
  });
}

window.onload = printLabel;
</script>

</body>
</html>
